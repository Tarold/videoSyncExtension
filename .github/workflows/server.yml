name: Server CI

on:
  push:
    branches: [master]
    paths: ['videoSyncServer/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['videoSyncServer/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: videoSyncServer

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: videosync
          POSTGRES_PASSWORD: videosync
          POSTGRES_DB: videosync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U videosync"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://videosync:videosync@localhost:5432/videosync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: videoSyncServer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: videoSyncServer/package-lock.json
      - run: npm ci
      - name: Start server and PostgreSQL
        run: docker compose up --build --detach --wait
      - name: Scripted WebSocket client
        run: npm run smoke
        env:
          SERVER_URL: ws://localhost:3000
      - name: Server logs
        if: always()
        run: docker compose logs server
      - name: Stop
        if: always()
        run: docker compose down --volumes
