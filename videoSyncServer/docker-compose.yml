services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videosync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videosync}
      POSTGRES_DB: ${POSTGRES_DB:-videosync}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-videosync}:${POSTGRES_PASSWORD:-videosync}@postgres:5432/${POSTGRES_DB:-videosync}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${SERVER_HOST_PORT:-3000}:3000'
    restart: unless-stopped

volumes:
  postgres-data:
